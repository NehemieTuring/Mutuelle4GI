spring.application.name=api

# Server configuration
server.port=8080

# Database Configuration (retrieved from environment variables)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mutuelle_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:mutuelle_user}
spring.datasource.password=${DB_PASSWORD:mutuelle_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate — schéma géré exclusivement par Flyway (pas de ddl-auto update/create)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# DevTools Configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Flyway — migrations versionnées dans db/migration (appliquées au démarrage, avant Hibernate)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.table=flyway_schema_history
spring.flyway.encoding=UTF-8
spring.flyway.placeholder-replacement=false

# Swagger / OpenAPI Configuration
springdoc.swagger-ui.urlsPrimaryName=Tous
